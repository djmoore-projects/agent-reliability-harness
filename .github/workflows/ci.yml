name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # Dogfood the gate on the offline example agent: no API keys, fully deterministic.
  gate-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Current agent passes the gate against the committed baseline
        run: |
          agent-harness run examples/toy_support_agent/suite.yaml --out out/candidate.json --trials 3 --no-judge
          agent-harness compare examples/toy_support_agent/baseline.json out/candidate.json \
            --suite examples/toy_support_agent/suite.yaml

      - name: A planted regression fails the gate
        env:
          TOY_AGENT_VARIANT: buggy
        run: |
          agent-harness run examples/toy_support_agent/suite.yaml --out out/buggy.json --trials 3 --no-judge
          if agent-harness compare examples/toy_support_agent/baseline.json out/buggy.json \
               --suite examples/toy_support_agent/suite.yaml; then
            echo "::error::gate should have failed on the buggy agent"; exit 1
          fi
          echo "Gate correctly blocked the regression."
